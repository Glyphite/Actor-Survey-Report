    const mdText = `# 简介篇

相信你们能很敏锐地抓到这个手册的关键词——扮演、调查、报告。

迷雾以你们那几近于妄想的愿望作为报酬，将你们拉入了这场游戏。

在这里，你的身份不再重要，背景不再明显，你是你，可你同时也在扮演你。

有点难理解？没关系，你很快就可以体验到这种违和的人生。

这里是扮演者调查报告，欢迎你们的入职。

## 游戏准备

：骰子：数量足够多的六面骰子，用于掷骰。

：硬币：用于表示醒神和瞑目这两个特殊货币，字面向上为醒神，花面向上为瞑目。

：人员：至少一名扮演者以及合格的主持人。

## 剧情主持

任务主持由迷雾代理人(Fog Agent)负责，他可以向副本提出建议，检定剧情走向，提前了解信息——但小心别上当，他也是个玩家，只是个握有提案权和偶尔主持权的家伙。

甚至掷骰也不需要他的同意，代理人只负责描述结果，不能控制行为。玩家可以自由决定何时掷骰。

## 游玩角色

对于扮演者而言，游玩角色由两个部分组成。

一个是自身本体，有着完整的身份和能力；另一个则是扮演对象，对象是扮演用的躯壳，拥有相应的身体素质，但灵魂仍旧来源于扮演者。

这正是与其他规则不一样的地方。

扮演者们知道自己是扮演者，知道自己是在执行扮演任务，所以代理人并不需要赋予扮演者一个动机——**扮演者需要自行创造动机**。

哪怕清楚地知道前面是危险，但是在任务的要求下，扮演者也必须向前。

而相应地，扮演者也可以进行超游推理，甚至使用不属于这个世界的能力，**只要不被识破即可**。

## 术语解释

：积分：用于向迷雾兑换奖励时所使用的货币。

：醒神：代理人的特殊货币，用于提高难度，操控检定结果。

：瞑目：扮演者的特殊货币，用于提升能力，操控检定结果。

：拼图：用于构建能力体系，可带来超能、装备等特殊效果。

：代理人：负责控制剧本的走向，但并不像其他规则那样“最终解释权归主持人所有”。

：扮演者：剧本的参加者，生活在一个患有疾病的世界里，而迷雾给出的任务奖励则能让扮演者在他们那危险（也许）的世界更好的生存，甚至解决问题。

<p>&nbsp;</p>

# 角色篇

创建角色时，可按以下步骤进行：

1. 病态世界，关于世界观的描述，应包含病态的异常现象。
2. 身份信息，如名称、年龄、性别、种族等背景及故事。
3. 思想倾向，通过设定信条、欲望与反应框，来定义心理特征和行为模式。
4. 个人能力，分配属性以及技艺，这将决定行动能力。
5. 上面都是设定，如果你已经了解清楚基础设定，可直接跳转到[创建角色](./char.html)。

## 病态世界

根据雇佣手册……迷雾只会从那些烂透了的世界里面选一个相对正常的员工。所以，你们每个人都对应着一个不正常的、病态的世界。

这里说的“病态世界”可不是什么诗意的比喻，不是的，那些不该存在的玩意儿是现实的蛀虫。

它们潜伏在你们的世界里，像病毒一样浸染常识，腐蚀理智。有知者无能为力，无知者习以为常。

就像一群蚂蚁在腐烂的苹果上狂欢，却不知道苹果已经烂到核子里了。

不过你倒也不用对这个世界级的疯人院太过绝望，起码你还活着，不是吗？

在这场疯狂的派对上，你至少是个活跃的舞者。

（当然，不想跑现实剧情的人也可以将病态设定的影响力无限削减至近似于无，但只能是影响力低，不能没有。）

| 规律 | 描述 |
|:----:|------|
| 只知现象 | 扮演者知晓自身世界存在的异常现象，但也只有现象。具体原理应由其他人补齐。如：杀人成瘾，扮演者只知道有这个现象，但并不清楚原因——这正是需要扮演者去探寻的。 |
| 不可患病 | 扮演者本身最多只能牵涉、而不可直接参与设定。举例：可以是好友死于杀人瘾患者，但扮演者本身不能是杀人瘾患者。因为这些异常之处本身就是病，而迷雾并不会招揽患者来工作。 |
| 传播范围 | 病态设定波及范围仅限定于自身文明，最多可除扮演者以外，全部生命都处于病态影响范围。但注意，若如此做，你将孤立无援。 |
| 特殊情况 | 某些特殊的病态设定可以无视规则3，或者说……规避限制。例如“行尸走肉”异常，所有死去的人都会复活为僵尸（此时被感染），但还没死的人就不算感染，相当于影响全球，却又没生效。 |
| 战力标准 | 武力只能维持在低武，不可出现一人成军的情况，科技最多为现代。 |
| 通过标准 | 选取第三个人作为评委，由其决定是否通过，如果不通过需要给出详细理由。 |

## 身份信息

### 年龄

由于本规则并没有使用年龄来限制扮演者的能力或者经历，所以年龄的影响其实不是很大……毕竟是一个世界才挑出来的一个人，有点异于常人也很正常。

PS：如果非人族，则按比例扩展为对应的年龄阶段补正。另外魂魄是角色属性，详见后文属性状态。

| 年龄 | 补正 |
|:----:|:----:|
| 每小3岁 | 魂魄各-1|
| 10~19岁 | 魂-1；魄-1 |
| 20~39岁 | 魂+0；魄+0 |
| 40~49岁 | 魂-1；魄-1 |
| 每加10岁 | 魂魄各-1 |

### 背景

性别、国籍、人种、经历及背景故事的总和。

扮演者并不是只会在副本里参与任务，在现实世界同样有剧情，所以即使有些参数在副本里用不到也还是有必要设置的。

另外，在没有扮演任务的空白期（我们将其称为幕间），扮演者也可以用于学习或锻炼，提升能力。

| 背景 | 介绍 |
|:----:|------|
| 姓名 | 扮演者的称呼，也可以用昵称，无所谓。 |
| 性别 | 男女或者多元化都行，不过虽然无所谓……但还是多少正常点吧 |
| 国籍 | 不必使用现实国籍，毕竟世界观都虚构了。语言方面会自动翻译。 |
| 种族 | 同样是不局限于现实种族，你可以给自己的种族额外的设置特性，例如更善于运动之类的，但注意，设置具有明显优势的种族需要消耗额外的瞑目，详见后续**购点法**介绍。 |
| 信用 | 财富权势的总和，默认水平为发达国家的小康家庭。若想提升信用，详见后续**购点法**介绍。 |
| 经历 | 简单描述一下角色经历和性格，以及认识的人等等，可以将此栏视为角色的简单描述。 |

## 思想倾向

扮演者的思想被分为**信条**和**欲望**两个倾向——是的，所有扮演者都得有它们，因为你们是被迷雾挑选出来的幸运儿。

不是每个人都有灵魂的裂缝，但你们有，所以恭喜你，现在你可以选择是做个坚守底线的傻瓜，还是个追逐幻影的疯子。

践行信条会让你像个扎根现实的侦探，信念坚定，能够面对更多精神上的恐怖；而追逐欲望则会让你沉浸在无限的疯狂中，那会让你有点发疯，但也能让你获得超凡的力量。

但注意，思想是你灵魂的锚点，但不是永恒不变的锚点。

根据你的经历，它们会变化，也会衰退。

### 信条

信条是那些你发誓要坚守的底线，即使在凌晨三点，当你一个人在黑暗中醒来，怀疑一切的时候，它也会绝不动摇的提醒你生活的底线在哪里。

信条与爱好不同，它是基于底线的坚持，比如警察的“逢恶必除”，或者对家人的“誓死守护”。

**当你陷入绝境时，信条会帮助你保持清醒。**

### 欲望

欲望是你灵魂的垃圾桶，塞满了你永远不会在阳光下承认的东西。

它是你心中最真实的低语，总在你最脆弱的时候冒出来，让你像个疯子一样追逐幻影。

**当你追逐疯狂时，欲望会让你更加强大。**

> 具体用法：<br>对于游戏中符合欲望的单次检定，玩家可以获得一个辅助骰（例如欲望是吃饱，为了吃饭而进行的工作会有辅助骰）。<br>
> 同时，如果玩家为了信条而濒死或疯狂时，可进行一次检定，判断是否能够暂时维持清醒。

### 反应

反应框表示面对事件时的处理倾向，直观的影响到了玩家的手段和效率。

反应框分为锐▲、圆●、钝■三类，最多可拥有三个，即三相。在种类的安排上，反应框并不要求一定要各选一个，相反，规则反而很提倡扮演者“偏科”。

在正常安排时，反应框不会有任何效果，但是若存在偏科，则可以获得相应的偏科效果，例如让扮演者更善于正面应对或者圆滑回避等。

当然，有偏科的强项就自然有弱项。对于弱项倾向，扮演者将无法进行对抗（平常依旧能正常行动）。两个同样具备弱项倾向的人则是双方都无法采取行动。

反应框确定后一般无法改变，除非扮演者遭遇重大变故；或者触发了[疯狂骰](#疯狂骰)主导的销毁反应框副作用。

| 类型 | 范围 | 效果 |
|:----:|----------|----------|
| 锐 ▲ | 近战远程类技艺 | 获得多余反应框数量的辅助骰，并且在**战斗时可透支行动点**。 |
| 圆 ● | 探索侦察类技艺 | 获得多余反应框数量的辅助骰，并且在**行动时若具备合适的理由，可孤注一掷**。 |
| 钝 ■ | 交互知识类技艺 | 获得多余反应框数量的辅助骰，并且在**行动时若具备合适的理由，可孤注一掷**。 |

## 属性状态

属性分为“魂”和“魄”两个参数，它们量化了你的灵魂和肉体，同时代表了角色状态和行动能力。

一个普通成年人的属性值大约在5左右，满值为10。如果有超自然的加持，理论上能够突破突破上限。

需要注意的是，掷骰使用当前值进行检定。这也就是我开头说它们代表了角色状态和行动能力的原因。魄同时象征了玩家的身体素质和血量；魂同时代表了精神强度和理智。

当你受伤或受刺激时，这些数值会相应扣除，使得你的成功率也会相应的下降——毕竟一个肠子外露的人不可能还行动自如，除非你是僵尸，那另当别论。

### 灵魂

魂是你用于认识世界的信号，一个充满幻觉和破碎哲学的漩涡。它是你的精神堡垒，也是你投降前必须越过的那堵墙。

魂越高，你就越能对抗疯狂的低语、看透世界的荒谬本质。但同时，你也会越发清晰地面对绝望。

你精神越低，就越接近疯狂。

| 数值 | 描述 |
|:----:|----|
| 1-3 | 崩溃边缘，无法处理基本情绪。 |
| 4-6 | 正常成年人范围，可满足正常工作生活需求。 |
| 7-9 | 心理咨询师水平，在压力下表现稳定。 |
| 10 | 精神极限，仅极少数个体在冥想或极端经历中达到。 |  

### 体魄

魄是你那用于承载思维的肉体牢笼，一个充满疼痛和虚假力量的监狱。它是你最后的堡垒，也是死亡时最先背弃你的盟友。

魄越高，你就越能对抗肉体的衰败，但也仅此而已，它并没有能力让你逃离所有死亡。

| 数值 | 描述 |
|:----:|----|
| 1-3 | 极虚弱或患有严重疾病，无法完成日常活动。 |
| 4-6 | 正常健康成年人范围，可满足正常工作生活需求。 |
| 7-9 | 经常锻炼的爱好者，体能优于常人。 |
| 10 | 专业运动员水平，在特定领域表现突出，仅极少数个体在巅峰状态达到。 |  

## 知识技艺

技艺和技能不同。技能是拼图带来的超自然力量；而技艺则是人类用于维持理智的最后壁垒。

### 等级

技艺规则整体而言和其他规则相差无几，比较大的变动是多项类似效果被合并为了单个技艺，这里重点给出技艺等级对应的效果（LV1~LV10）。

当你的技艺等级达到10级时，你将可以获得名为“特典”的加持，达到近乎超自然的效果。例如在别人眼皮子底下隐藏自己等。根据扮演者平常对于技艺的用法，同一个技艺在不同人手里也有不同的特典。

| 等级 | 描述 |
| :---: | --- |
| 1 | 对该技艺有模糊印象，仅能协助老手完成简单任务。 |
| 2 | 处于学习最基础知识的阶段。能独自完成简单、固定的步骤。 |
| 3 | 掌握了最基础的流程和常识。能在有明确指引或简单场景下，独立完成常规的、模式化的任务。 |
| 4 | 能独立处理大部分常见任务。对技艺有基本的理解，能解决一些简单的自身问题或小故障。 |

## 拼图能力

### 分类

拼图卡物如其名，与常规的拼图相同。它是一张四四方方，存在**缺口**或者**接口**的拼图。

拼图是有品级的，并非每个拼图都有四边，一般只有存在“缺”或者“接”的边才会算作一边。这也算是拼图卡品质的一种叫法，四边拼图是最高品质。

拼图卡按颜色分为超能、装备、生物、属性四类，每个类型对应一种颜色，例如超能拼图为黄色，装备拼图为蓝色，生物拼图为绿色，属性拼图为红色。

在使用拼图卡之前，玩家需要获得一件核心用于承载拼图，核心的样式没有固定，可以是魔法棒、骑士腰带，也可以是眼镜，外套等其他物品。

不同核心能够承载的拼图也不一样，少部分特殊的核心甚至只能挂载单一类型的拼图。当然，相应的，这类偏科的核心也能够提供更大的加成。

当你获得核心后，你就可以开始着手研究对于拼图的使用了。

PS：换句话说，在你拿到核心之前，不需要看本栏目的相关内容。你可以直接跳转到[创建角色](#创建角色)。

### 组合

拼图，顾名思义，当然是具备拼接功能的。这里要提到一个概念也就是边数。

拼图卡中存在缺口或者接口的边被称为 **边数**，在使用时，扮演者可动用的拼图卡边数等同于掷出的疯狂骰数量，也就是一边对一骰。

具体来说，即玩家掷出一枚疯狂骰时可使用一边拼图，掷出二枚疯狂骰时可使用一枚二边拼图或者两枚一边拼图。

组合规则：

1.  不可相同：「火焰」可以和「球形」拼接，但不能和另一个「火焰」组合。但是类似词意是可以组合的，例如「炙热」+「火焰」。
2.  联想空间：例如，「手」、「脚」，也许你可以加上一个「合并」，组合出「手脚并用」，但在没有这个作为粘合剂的拼图时，手、脚就算是没有联想空间。
3.  拼接有序：谁拼谁接对于最终效果是**可能产生影响的**。例如「火」「兔子」的组合中，后者组前者是「兔子火」以火焰为主，即兔子形状的火焰；而后者组前者则是「火兔子」，即召唤拥有火焰能力的兔子。
4.  生效范围：拼图只能对临近的组合拼图进行生效，对**子拼图接入的其他拼图**不生效。

### 培养

获取：正如前文所述，拼图是通过对其他超能体系的转化得来，玩家可以在结算任务时消耗积分对自己所掌握的能力进行兑换。但注意，能力会被拆分为多张基础的拼图卡供玩家兑换，而不是一张拼图就包含全部能力。例如镭射眼，会被拆解为「镭射」、「眼」、「放射」等卡片。

改造：对于拼图卡，共有**合炼、拆练、平炼**等方法，改造需要消耗相应的积分和材料。改造功能由迷雾进行提供。顺带提醒一句，炼制并不是百分百成功的，而失败则有损坏的风险，除非有必成的把握，不然最好还是留几枚拼图卡备用。

1.  「合练」，可将完整词性的拼图合并为一张，例如「暗」「影」，假设两张卡都是二边卡（合计四边），则合并后由于一边一缺被消耗掉用于合并了，此时两张卡片合计被视为一张二边卡「暗影」。好处是能力不变但需要的疯狂骰减少了，坏处是以后无法自由组合，除非你重新拆炼为两张拼图。
2.  「拆炼」，可按为字对拼图卡进行拆分，如火焰按字可拆分为火、焰。拆分后不会补充相应的边数，需要后天重新增加；
3.  「平炼」，可修改拼图卡边数，或将其转化为类似含义。以「火焰」举例，可平炼成炙热、灼烧等。

## 创建角色

接下来就是创建角色的正式流程了。具体创建网页可[点击此处进行跳转](./char.html)，下文为创建方法的介绍。

角色的参数大致可以分成人设和能力两类，玩家不管先从哪一个开始创建都是可以的，只要最后对的上就行。也就是你不能出现人设是战斗高手，结果能力是读书的这种不匹配情况。

另外一般情况下，建议先从设定开始，毕竟年龄和种族等设定还是会影响属性的。

### 设定

玩家只需要根据上文填好相应的病态世界观，以及角色的年龄、姓名、性别、国籍、人种、信用、经历、信条/欲望、反应框就可以了，这些都是可以自己设定的东西。

其中病态世界观还需要由其他玩家来进行原理完善，设定好后应该打包成一个只有设定者知道解压密码的压缩包并上传到云端储存里，避免后续修改的可能性。

### 能力

能力的创建方法只有一种——购点法。

具体点说，玩家初始拥有共计8瞑目的初始点数池，瞑目是一种具有特殊能力的货币，具体能力详见后文（你也可以选择不使用瞑目来提升角色，而是保留作为特殊货币使用）。

在此处，瞑目用于购买属性、技艺等能力。

在创建角色时，购买正向效果会消耗瞑目，相应的，出售正向效果（例如初始就有的种族天赋、属性、技艺等）可以获得瞑目。

但后者仅在创建扮演者时可使用，过了创建阶段后，再想出售效果就需要花费瞑目了。无论好坏，区别只是卖出负面效果花费更大；类似情况的还有基础属性，也是仅在创建扮演者时可以购买，日后再想培养，就只能通过锻炼等手段提升。

购点法的大致流程为：

1. 确定好种族，获得相应的天赋。
2. 确定好年龄，计算相应的补正。
3. 执行购点法，根据清单来买卖。

：属性：分为魂、魄两种属性。初始皆为5，最少为1（残废），满值为10。购买或售卖对应的价格为[1-3]1瞑目，[4-6]2瞑目，[7-9]4瞑目，[10]8瞑目。

：技艺：玩家掌握的各类知识和能力，不同技艺有不同初始等级，价格为[1-3]1瞑目，[4-6]2瞑目，[7-9]4瞑目，[10]8瞑目。同时属性和技艺都是不设置初始上限的，但只要你想，你完全可以在初始时就将技艺提升到满级，并拿到相应的特典效果。这么设计主要是因为掷骰规则的原因，我大概算了一下，需要62枚骰子才能达到COC技能99%的成功率，你就是满级了也保证不了必定成功，所以没必要设置什么上限。（不过假设你的技能初始等级为2，你一共需要1*4+2*2+4+8=20点瞑目，相当于你需要全属性都 -2再加上初始8点瞑目才能满足这个需求，虽然是开放了这个上限，但代价也不小）。

：拼图：是的，拼图也可以买卖，可购入清单详见上文的拼图表格。

：信用：消耗1瞑目可以让家境从中等提升到富裕，再消耗1瞑目继续提升到社会名流（上限）。身份仅适用于扮演者自身的主世界，在任务中无用。

以上仅为介绍，如果你确认了解清楚了，可以点击上方的跳转按钮跳转到创建网页进行创建。

## 故事结算

根据玩家完成的任务来进行相应的结算，奖励一般为积分和该世界“特产”的物品和能力。

「故事结算。」

「成功达成《潜水反射》主线任务——60分；」

「总击杀数二百三十一人：你晚上真的不会做噩梦吗——5分；

「二级英雄：杀了这么多人还能当英雄？你可当个人吧——5分；」

「三十万信用：果然还是写在刑法里的来钱快——5分；」

「高级超能：你获取到了高级超能——5分；」

「中级超能：你获取到了中级超能——5分；」

「低级超能：你获取到了低级超能——5分；」

「合计评分为100分，你的最终评价为100%（大吉）。」

「故事结算完成，你解锁了所有可兑换物，你获得了100点积分。」

「你获得完本书籍*1，你可在内容保存库开启。」

「你获得专属奖励：暑假，你可在内容保存库开启。」

「《潜水反射》结算完毕，扮演者，感谢你的工作！」

## 技艺提升

任务中带来的技艺提升不会立刻获得反馈，只有在结算时才会一并计算，因此归类为故事结算区域。根据扮演者的技艺及角色卡所给予的天赋，有如下情况：

1.  未掌握：当扮演者未学习技艺且具有该技艺的天赋时，成功使用一次该技艺即可掌握。
2.  低于LV.5：当扮演者技艺等级低于LV.5且天赋大于扮演者当前技艺等级时，成功使用“对应技艺等级*2”次数即可提升等级。该提升不可叠加，即扮演者在每次任务中，单项技艺最多提升1级，不过数量倒是没有限制，可以多技艺同时提升。
3.  大于LV.5：当扮演者技艺等级大于LV.5时，技艺提升失效，天赋依旧可用（也就是能使用天赋作为检定等级，但不再获得天赋带来的经验加成），此时，扮演者只能通过日积月累的锻炼进行提高。

注：别忘了秩序主题的限制，扮演者无法将技艺提升至超过秩序主题，当技艺等级达到上限时，提升机会将被视作无效，不可保留。

## 幕间成长

幕间成长一般是通过消耗某些特殊道具提升自己，或者现实生活中长时间训练。

现实中的活动类似于生活模拟器，扮演提供的能力在正常情况下是不可以在现实世界使用的，你还是得当个普通人。长时间的训练需要消耗情绪值以及金钱，而工作可以获得金钱，当然，你也可以使用积分兑换财富……咳咳，理解成放置游戏也行。介于现实生活较为平淡，代理人可以快速跳过重复的剧情，改为数字统计。如果代理人乐意的话，可以把现实生活的工作与学习变成类似签到打卡的东西，或者弄一些有趣的小游戏来替代这些的剧情。

当然，现实也不是只有枯燥的数值模拟，前文所设定的病态正是用于此处——你牵涉其中，并且现在有了能力，难道就不想去调查调查？这可是拯救世界、解决那些困扰你问题的好机会。

## 货币交易

### 积分

货币即积分，通过完成任务及成就即可获得。积分可用于购买物品或者玩家之间交易，但交易会收取5%的手续费（向上取整），且执行任务时不可转账。

积分的主要用途为向系统购买物品，可购买类型分为两种。

：任务商店：仅在执行任务时出现的商店。店内出售的物品根据任务需求而决定，价格也会随着剧情及需求度而变化。每次任务一般或多或少都会出现几次需要使用到迷雾道具的情况，所以还请备好积分。另外，用不上的道具还可由商店半价回收，回收积分同样是即时到账。

：结算商店：结算时出现的商店。除去一些固定的道具，如恢复魂魄用的蓝剂、红剂外，所有道具都是扮演者在本世界中接触到的、了解到的物品。玩家在任务中获得的物品和能力并不能带出世界，但可在结算时购买，若扮演者在剧情中获得了广义上认可的所有权，售价可降至八折。当然，如果扮演者有能力，也可以购买原材料自行制作。

需要注意的是，任务中时常会出现需要积分的情景，但却并没有很多即时获取积分的手段——转账和任务结算都是通关后才获得的——所以保留一定量的积分是很重要的。

若积分不足，玩家只能通过做成就或者半价出售物品来救急。

### 特殊

特殊货币分为“醒神”和“瞑目”两类。

：获取方式：在游戏过程中，扮演者方多余的、无法使用的成功数会被代理人收购，转化为“醒神”。代理人收购成功数并不需要付出什么代价，更确切的说——只有当代理人使用醒神之后，才会有一枚瞑目进入结算池（即游戏结算完毕后才可获得，这意味着由醒神转化为的瞑目不可立即用来反制醒神；且如果代理人不使用醒神的话，玩家无法获取瞑目）。

：分配方式：进入结算池的瞑目由扮演者共同进行分配，除非转化之前的醒神仅用于针对某一特定扮演者，否则其归属权应属于所有同组扮演者。若瞑目数量不足以进行分配，请自行协商，一般建议使用积分作为未获得瞑目者的补偿。

温馨提示，瞑目十分宝贵，请勿贱卖。

| 用途（醒神） | 说明 |
|:--:|:--|
| 反制瞑目 | 可使瞑目的效果无效，允许追加对冲，即：可以对反制进行反制。 |
| 改变环境 | 按小中大排列，例如以天气举例：细雨一枚、大雨两枚、暴雨三枚。 |
| 改变任务 | 同样按小中大排列，若要抹除扮演者的大部分成果，需要三枚以上。 |
| 改变骰池 | 可消耗醒神，增加或减少任意一个NPC的任意掷骰里的一点成功数，无法对自身以外的扮演者生效。 |

| 用途（瞑目） | 说明 |
|:--:|:--|
| 反制醒神 | 醒神被反制后也被视为没有生效，无法转化为瞑目。 |
| 短暂休息 | 恢复全部反应框、降低全部力竭、避免一次疯狂，但骰子效果导致的理智异常除外。 |
| 恢复秩序 | 消耗等同于永久疯狂骰数量的瞑目，移除一枚永久疯狂骰，需要一小时的时间。 |
| 增加成功 | 在使用者的任意掷骰中增加或减少一点成功数，不可替其他角色使用（但可将瞑目交易给对方）。 |

# 规则篇

## 识破扮演

### 识破

识破值以百分比表示，代表着扮演者扮演的被识破程度。游戏中任何被发现的异常行为都会增加识破，相应的，精彩的扮演也可减少识破值。

增加识破的行为大致为以下几种，当反常行为短时间内连续出现时，则会拉满额外追加的固定值。

| 行为类型 | 骰子 | 额外追加固定值 |
|:--:|:--:|:--:|
| 出现与性格不同的言语 | 1D6 | 依据内容决定是否额外追加1~6 |
| 出现与性格不同的行动 | 2D6 | 依据内容决定是否额外追加1~12 |
| 行事与剧情原有惯性冲突 | 5D10 | 依据内容决定是否额外追加1~50 |
| 毫无征兆表现出角色未经历过的内容 | 5D10 | 依据内容决定是否额外追加1~50 |

当识破过高时，扮演者将会明显受到人们下意识的排挤和偏见，甚至直接被世界针对性制造意外。

而若在结算时，扮演者的识破值低于10%，则可获得150%的基础积分奖励；若识破值高于90%，则基础奖励削减为50%。

| 识破 | 后果 |
|:--:|:--|
| ≥50% | 会被亲近的人极大程度怀疑，只要被调查到证据，识破度就会暴涨到80%。 |
| ≥75% | 连周围的人也开始怀疑，路人可能会把你当成逃犯或其他的什么凶恶之徒。 |
| ≥90% | 直接受到世界的针对，此时识破值无法再降低。调查员每小时遭遇一次意外，并进行一次1d2的检定，结果为2则增加下次难度等级，直至死亡或者脱出世界。 |

### 扮演

角色卡会简略注明角色的背景，除此以外就没有更多的其他信息了，为了避免思维混乱，迷雾并不会将角色卡的记忆全部塞进扮演者身体里，所以扮演需要依靠扮演者自己收集信息，猜测原主性格。

在合适的情况下，扮演者也可以找一些借口来解释自己的变化，如果对方认可了就不会提高识破值。

当无人注视时，扮演者可自由进行发挥，除非这个世界启用了什么特殊规则，否则一定是安全的——前提是扮演者能确定无人注视，或者……在目击者尚未反应过来时将其击杀。

注意，一定要在未反应过来时，比如背后偷袭。否则这种怀疑也会顺着怀疑者的思维传入世界中，并且在其被击杀的时候会无限放大。当然，如果扮演者要击杀的目标是角色卡的仇人，动机上合理，则一般来讲并不会有什么事情，只要别显露超出角色卡的能力即可。

总而言之，就一句话，保持原角色卡的性格及行事风格。一旦有被发现的迹象，需要立刻进行补救，譬如做出某些很符合角色卡的行动，或者在不被发现的情况下解决提出问题的人。

### 规则

：虚弱世界：这个世界已经被病态侵蚀至深了，没有余力应对入侵，因此扮演者们可自由行动。

：心音检测：这是个被入侵过的世界，相较于平常，这种类型的意识会更有警惕性。世界之眼会间歇性注视扮演者，注视时连场外对话也会被记录，若出现超游想法，则直接增加识破值。

## 掷骰检定

### 时机

**掷骰时机由扮演者自行决定**，不受代理人限制。但注意，**掷骰仅用于事件具有不确定性时**。

比如：你不确定是否能命中远处的物体，或者不确定是否能找到某人。

扮演者并不是做任何事情时都需要进行一次掷骰，也并不是每次行动都一定有效。例如经验老道的司机常规驾驶车辆不需要掷骰（前者），或是试图在一块什么都没有的荒地调查线索（后者）。

当然，扮演者掷骰并不需要经过代理人同意。即使扮演者采取了意想不到的行动，只要不是明显不可能完成，并且不会对剧本展开造成困扰，就应该允许其的行动检定。面对没有任何安排的地方，代理人也可以只说“没什么特别的”，或者给予一些不至于影响剧本展开的描写。

但本规则提倡即兴发挥，如果扮演者的行动是按现实逻辑来讲应该有效果的，代理人可以视情况而定，给予一些正面反馈。

另外，扮演者虽然拥有掷骰自主权，但**不可拒绝应该当前行动应该有的掷骰**。基于第一条规则：“掷骰仅用于事件具有不确定性时”，如果在进行某些具有不确定性的行动时，经代理人判断需要掷骰，则扮演者必须进行掷骰，出现分歧时请以代理人的判断为准（除非代理人的判断不合理）。

不过在进行掷骰，也就是行动之前。扮演者还可通过改变行动的方式规避掷骰或者降低完成的难度，比如清理入侵过密室的痕迹需要至少2成功，而若只是清理能认出来自己的痕迹，只需要1成功就行。

原则上讲，动作一经发布就不可以修改，所以建议行动之前还是多问问代理人，避免分歧，合理的交流可以很有效地保证游戏正常进行。代理人与扮演者之间也可以准备一些快速交流的手段，比如没有信息的地方可以发个表情包，以提高游戏速度。

## 结果判断

### 成功

任意一组相加不小于10的骰子都可以算作1点成功数，组合不限数量，只要≥10即可。

需要注意的是，为了便于计算，加减是直接根据骰子来定的，所以会存在浪费现象。例如：6、3、3、6、2，理论上能组成20点，但实际上是6+3+3≥10，而6+2＜10，所以本次掷骰只获得1点成功数。

### 强化

等级≥6时，可以使相加为15的一组获得2点成功数。

### 追加

当骰子掷出 \`6\` 时即为追加骰，额外掷出与追加骰数量的骰子，追加骰依旧可继续触发追加。

### 残缺

当骰子掷出 \`1\` 时即为残缺骰，残缺骰依旧可用于组合。但无论组合结果如何，每枚残缺骰都会扣除相应数量的成功数。

等级≥8时，不会承受残缺效果。

### 优化

当扮演者持有多余目标的成功数时，需将其消耗以获得一些额外奖励，这个手段被称为优化。

最常见的优化方案就是战斗中的多余成功数用于加深伤害，或者翻找资料时获得额外情报。但是优化并不是一定能触发的，若在设定中此处确实只有这么多信息，那么再多成功数也无法获得额外的情报。

此时，代理人需要购买下这个多余的成功数用于转化成“醒神”，这点前文的货币已经提及。总之，多余的成功数不可保留，不可加入到下次掷骰中。

### 失败

失败并不是成功数达不到要求，而是成功数为负数。

在成功数达不到要求的情况时，扮演者可选择将成功数用于何处。这代表着扮演者如果愿意承受代价，还是可以获得信息的。或者哪怕1点成功数都没有，也可能只是花费更多的时间才获取到信息。

只有当成功数为负数时，扮演者本次行动才**必定无收获**，并且会出现一些负面状况。最糟糕的情况下，甚至可能导致信息被销毁，永远无法获取此段信息。

关于检定结果，代理人应在检定之前就讲明，譬如“即使没有成功你也可以获取信息，但是会花费更多的时间”，但只需要讲明未成功及失败的情况就行，大失败或大成功是少数，没必要每次都提前思考。

：PS：值得一提的是，ASR中并没有明文规定的大成功或者大失败。但由于每一点成功数都要发挥作用，当扮演者具有多余的成功数时，基本上就算是大成功级别了，大失败同理。

### 难度

每一个由剧本设定的需要掷骰的事件都具有难度，难度会被拆分为以成功数为单位的小事件，成功数的用途可自行决定。某些大型难度可以由扮演者共同对抗，比如抬起一块很重的石头，每位扮演者的成功数都可以抵消一部分难度。而如果有多余的成功数，详见下文的余值优化。

：举例：在火场中获取一份资料，逃离火场需要1成功，避免被烧伤需要2成功，获取文件需要1成功，共需4成功数。若成功数不足，扮演者可自行选择是放弃资料避免受伤，还是硬抗火焰抢救资料。

### 对抗

在技能对抗中，双方的成功数会互相抵消，成功数较多的那一者获胜，依据多出来的成功数进行结果检定。但成功数抵消并不意味着没有行动，若在战斗时双方成功数恰好都抵消了，则代表攻击方的攻击被格挡或者闪避，而不是攻击打偏——打偏只发生在没有成功数时。

当然，这个主要影响的是描述，和掷骰结果本身效果无关。

对于对抗时的失败数，失败会产生类似对方增加成功数的效果。但这些失败点无法被对方使用，只会自动加强对方的行动。例如让对方造成的伤害加深。

## 主导骰池

在扮演者调查报告中有许多种不同类型的骰子，这些骰子被统称为骰池。

在多个骰池同时进行的掷骰中，∀数值最低、低数值骰数最多的骰池被称为主导骰池，根据骰子类型的不同，主导骰池会有不同的效果，主导产生的具体影响会在下文进行介绍。

这里主要讲解如何判断主导骰池。

1.  以出现单个最小数值的骰池为主导，注意，是单个，与总数值无关；
2.  若有出现相同的最小数值，则判断第二小数值，拥有更低的第二小数值为主导；依次类推直到找完全部组。
3.  如果以上都相同，则以掷骰数量最多的那个骰池为主导；

举例：

A组：1、1、5、4、4、6、3

B组：1、1、5、4、4、6

A组与B组最低数值都为1，并且后续第二、第三小数值同样相同，但是A组的骰子数更多，所以是A组主导。

### 秩序

主导骰池：减少1点力竭。

秩序骰相当于等级。

在掷骰时，根据等级，扮演者可以获得相应数量的秩序骰。当等级足够高时，不仅可以获得属性上的奖励，一些对于其他人来说不确定的事情，对于秩序足够高的扮演者来说完全可以百分百完成。秩序等级最高上限为十级，一般而言，五级以下的秩序技能可以在任务中快速提高，但五级以上技能需要日积月累锻炼。

谨记，秩序是你保持理智的基础，请小心维系已经站在悬崖边的思维。

：冷寂：特殊状态，在一次掷骰中出现三枚以上的六面骰时触发。本次行动执行完毕后会陷入失神状态，D10时间内只依靠本能行动；状态结束后，可任选一项以下奖励：减少1点力竭值，恢复一相反应框，或者获得3点技能经验。


### 辅助

主导骰池：同秩序，属于秩序的一部分。

优势/劣势骰并称为辅助骰。当扮演者比敌方有优势时，可向代理人申请辅助骰；反之则为劣势。

辅助骰其实就是对秩序的一个额外增减，用于表示角色的发挥程度，具有优势时发挥的好，可掷骰的数量就多，反之则少。

为了便于计算，辅助骰只在扮演者身上计算，敌人的优势也就是扮演者的劣势。以此类推。

另外，无论等级比对方高出多少，由于这些只是辅助能力，扮演者只能获得1枚辅助骰的加成。想获得多枚辅助骰，得从多个方面的优势入手。

举例：扮演者的战斗技巧比对方高，所以在力量对抗中可以申请获得一枚技巧所带来的优势辅助骰，哪怕这个技巧是满级也是只有一枚优势；并且对方只有一只手臂不适合发力，对方的劣势骰转化为扮演者的优势骰，最后辅助骰总数为+2.

### 力竭

主导骰池：增加1点力竭。

力竭骰代表竭尽全力的程度，效果与秩序骰相同，但主导骰池及后果不同。

游戏刚开始时，初始力竭骰为0，此时扮演者可通过激活「主动」获取第1枚力竭骰。需要注意的是，力竭骰虽然可以加强角色的能力，但也需要控制好平衡，如果超过上限，角色会陷入严重的负面状态。

：主动：当扮演者主动增加1枚力竭骰时，该次投掷的力竭骰数量翻倍（先增加后翻倍）

：被动：你当前拥有的力竭骰数量，会固定加入你的每一次掷骰中，该效果无法避免。

：热溃：特殊状态，力竭超过上限时进入热溃状态。掷骰d10选择症状与时间，症状结束后力竭清零。之后再掷骰d10决定热溃后遗症持续时间，该期间内成功数-1，无法使用疯狂骰。后遗症时间内如果再次热溃，则持续时间翻倍。

### 疯狂

主导骰池：减少1点精神。

疯狂骰与拼图息息相关，扮演者只有在动用疯狂骰时才可以发挥拼图卡的效果。

疯狂骰的上限等于魂上限与当前魂的差值，扮演者可在任意掷骰中加入不超过上限数量的疯狂骰。

基于你的用法。疯狂骰可视为纯粹的加骰，也可以视为发动能力。

当你进行非魂检定时加入疯狂骰，视为加骰。

当你进行魂检定时加入疯狂骰，视为发动能力，你此时能调动的能力强度将由当前掷骰的成功数决定。

：疯狂：特殊状态，魂归零时进入失常状态。掷骰d10选择症状、时间，并永久扣除1点魂上限。失常症状结束后当前魂重置，但会将一枚秩序骰更换成永久疯狂骰。一旦永久疯狂骰超过扮演者魂上限，扮演者将会转化为梦魇怪物，以这种方式死亡的角色无法复活。

### 痛苦

怪物专用骰子，它们唯一且必定具有的特性就是无理智。

纯粹的破坏欲无法带来秩序，所以怪物们没有秩序骰，也不可以使用秩序技能。即，怪物无法做到撬锁之类行动，不过砸门或者跳过深坑等简单动作，怪物可以用痛苦骰进行检定。

在设计梦魇怪物时，代理人可根据扮演者们的标签等级设定合理的怪物，个人建议，梦魇怪物的设计最好遵循长处、弱点、特性三要素。

长处：梦魇怪物擅长哪方面的攻击，远程还是近程，又或者是攻速快或者防御高。

弱点：攻击哪里可以对梦魇怪物造成伤害，或者梦魇怪物攻击方式有哪些漏洞。

特性：为梦魇怪物制造一个看到就能想起来的特点，如猎奇的外观。

建议怪物难度分级：

虚弱三枚、普通五枚、精英八枚、领主十二枚、异化骰子数不固定，但是有特殊被动。

# 行动篇

## 战斗阶段

战斗的核心是"**行动点**"——每个参战者都拥有一定数量的行动点，行动点决定了你能在一轮内做出多少动作，同时也决定了你与他人的行动顺序。行动点会随着受伤、透支等原因而减少，当行动点降到 0 或更低时，本轮就再也无法行动了。

### 建立

战斗以**轮**为基本叙事单位，一轮代表所有参战者都至少行动过一次后的周期。轮在此处是模糊的时间概念，不需要与真实时间严格对应；每轮又分为若干**刻**，刻是用来判断行动先后与时机的单位。同一刻的行动视为同时发生，不同刻的行动按顺序依次结算。

每轮开始时，每位参战者都会获得等同于自己**魄属性**当前值的行动点。这些行动点既代表着行动力的多少，同时也决定了行动的先后顺序——剩余行动点越多，优先级越高。

每轮结束后，行动点**恢复**为当前魄属性的数量。注意，是"恢复当前魄属性的数量"，不是直接设置为当前魄属性的数值（透支情况下需要先还清）。

之所以要强调这一点，主要是因为：
- 魄的当前值会随着战斗而减少，受伤之后下一轮的行动力自然就会降低；
- 战斗中存在透支行动点的情况，所以"恢复"只是补上固定数量的行动点，而不是重置。

### 行动
玩家每次采取行动都要消耗任意数量的行动点，在行动点未耗尽之前可以连续行动。

若玩家的反应框存在对**▲（锐）**的偏科，则可以额外进行一次**透支行动点**的行动，透支的最大额度不能超过当前魄属性。

以下为战斗中常见的基础行动与所需消耗的行动点：

| 行动 | 消耗 |
|:--:|:--:|
| 等待 | 1 |
| 拾取 | 1 |
| 更换 | 2 |
| 移动 | 2 |
| 防御 | 2 |
| 装弹 | 2 |
| 瞄准 | 3 |
| 基础战斗 | 3 |

### 应对

行动点剩余值相同的角色被视为处于**同一时刻**，此时双方的行动视为**同时发生**——例如同时向对方挥拳等。在这种情况下，哪怕任意一方的攻击对另一方造成了致残效果，也不会影响到当前的行动，因为双方是同时行动的，致残等后果在行动结束之后才结算。

但也需要注意可能存在**即时**行动的情况，即行动一经宣言立即生效。例如"即时致残"可以使得另一方原本宣言的行动被直接取消。

对于应对而言，只有双方处于同一时刻时才能执行应对。如果角色的时刻（也就是剩余行动点）落后于其他角色，则只能一直被动挨打到轮到自己为止。

需要注意的是，本游戏并没有"反击"这种专门的行动。当然玩家可以通过连续使用"防御"与"攻击"两个行动来实现类似效果，但要注意每次消耗行动点后都会影响到自身与他人的行动顺序。

### 结算

结算发生在**每次行动之后**，而不是在一轮或一个阶段结束之后。

每一次单独的行动宣言与执行，都会立即进入结算流程，相关的伤害、状态、位移、判定结果等都会在该次行动完成后立刻生效，再进入下一次行动的宣言阶段。

**成功数用法：**
你的成功数只要比对方多或者无对抗时大于零就算成功，但一般来讲你的行动只会需要一个成功数，多余的成功数可用于一些行动优化：

- **加深伤害**：使用多余的成功数触发追击，追击消耗为当前行动的一半（向下取整），造成伤害也是一半。追击不可更改目标。
- **附加效果**：妨碍 2、击倒 2、自残 3。效果不是无条件附加的，要看你的攻击能否达成对应效果。
- **精确部位**：便于瞄准的部位消耗 1，不便于瞄准的消耗 2，非常精细的部位要求消耗 3。

## 追逐阶段

追逐战的核心是"**距离**"——双方之间的间隔不再以绝对的物理距离衡量，而是以**位置点**作为单位，每个位置点代表一个叙事上的节点（比如一个房间、一段走廊、一个街区、一道障碍等）。

### 建立

当一方试图逃离、另一方试图追上时，先进行一次**速度检定**：对于徒步，使用参与者自身的**魄属性**进行检定；若为驾车等载具追逐，则改用相应的驾驶技艺。

速度检定的结果将直接影响本次追逐中每轮可获得的行动点数（行动点基准值 = 魄属性）：

- 成功：行动点基准值不变。
- 大成：行动点基准值 +1。
- 失败：行动点基准值 -1。

调整后的行动点基准值一旦确定，整场追逐中不再变动（除非被特殊手段修改）。

**根据双方的行动点基准值，决定追逐的进行方式：**
- 逃跑方的行动点基准值 > 追击方：逃跑方直接拉开距离，代理人可描述如何被甩开，无需展开追逐。
- 追击方的行动点基准值 ≥ 逃跑方：追逐正式建立，初始距离 = 追击方行动点基准值 − 逃跑方行动点基准值（至少为 1）。这样确保了即使追击方略快，也至少需要两轮才能追上。

### 位置

位置点是追逐的基本叙事单位，彼此之间不需要等距。一扇上锁的门、一段楼梯、一段开阔的马路都可以是一个位置点。

代理人需要用纸笔画出一排点来追踪位置：
- 每个点代表一个位置点
- 参与者用字母或代号标记在自己的位置上
- 移动时只需将标记平移到新的点即可

追逐中的障碍（如泥沼、障碍栏、人群等）通常设置在**两个位置点之间**。

### 行动

追逐进行中采用与战斗阶段完全相同的"行动点/刻"机制，每位参与者每轮都会获得等于自身行动点基准值的行动点（基准值由「建立」阶段的速度检定决定，范围通常在 3~10 之间）。

**行动规则：**
- 参与者一轮内可连续行动，直到行动点被消耗完毕为止
- 剩余的行动点仍可用来发动攻击、防御、捡东西等战斗动作（需遵循战斗阶段的消耗表）
- 每轮开始时按"剩余行动点"决定行动优先级，行动点相同者视为同一时刻同时行动

### 障碍

追逐中的障碍会拖慢或伤害参与者，通常设置在两个位置点之间。代理人可指定合适的技艺用于跨越障碍。

**地形消耗：**
- 简单地形（开阔马路、直走廊等）：消耗 1 行动点 / 位置点
- 复杂地形（楼梯、狭窄通道、轻度障碍等）：消耗 2 行动点 / 位置点
- 需检定的复杂地形（人群、泥泞、急转弯等）：消耗 3 行动点 / 位置点

**处理方式：**
- **谨慎通过**：额外消耗 1 个行动点，获得 1 枚优势骰；
- **强行突破**：不消耗额外行动点，直接进行检定。

**失败后果：**
- 承受相应的伤害（由代理人视障碍性质决定）
- 额外损失 1D3 个行动点（不足则顺延到下一轮）
- 即便检定失败，依然会进入下一个位置点

### 屏障

屏障与障碍的区别在于：**屏障会完全阻断前进**，必须先解决才能继续移动，也就是失败了也无法进入到下一个位置点。例如：上锁的门、深渊、陡峭的高墙等。

**突破方式：**
- 开锁 → 鬼蜮伎俩
- 跨越 → 机动驾驶
- 撞开 → 魄属性检定

**失败后果：**本次移动停留在屏障前，下一轮仍需尝试；若强行突破失败，还可能受到伤害。

### 结束

追逐在下述情况之一发生时结束：
- 追击方与逃跑方位于同一位置点（追上）
- 逃跑方成功脱离追击方的追踪（拉开足够距离或利用障碍甩开）
- 其中一方因伤害、力竭、疯狂等原因无法继续行动

追逐结束后，立即切入正常的战斗或剧情流程。

## 隐秘阶段

隐秘阶段用于潜入调查或者其他具备时间、动静限制的场合。当你处于隐秘阶段时，你需要避免暴露，并且只有有限的回合可以行动。最终能获取多少信息或物品，是否能够成功撤离，都取决于你的决策。

### 建立

隐秘阶段建立时，需要确定两个核心要素：

- **隐秘**：代表当前的暴露风险，由情况决定，一般为 1~5 点。隐秘越低，表示你越容易被发现。
- **轮次**：代表剩余的行动回合数，由情况决定，一般为 1~5 轮。少数情况下可能存在无限轮次的情况，只要不被发现即可。

### 行动

隐秘阶段采用独立的行动机制，每位参与者在每轮开始时依次进行行动。

**行动规则：**
- 参与者在每轮中可进行多个动作，包括潜行、搜索、交涉、窃取、暗杀等。
- 行动顺序由参与者的**魄属性**决定，魄高者优先行动。隐秘轮不计算行动点，按次计算。
- 每次行动后，代理人根据情况判定是否产生**动静**：
  - 声音较小的动作只要不失败即可视为无动静。
  - 幅度较大的动作则需要至少 1 点成功来避免发出声响。
- 当产生动静时，隐秘至少 -1（更大动静会减少更多隐秘）。此时玩家可采取合适的补救措施来恢复隐秘（例如模仿猫叫骗过守卫），但前提是补救行动真的有效。

### 结束

- **轮次用尽**：区域搜查力度会加大，玩家此时仍可继续隐秘行动，但暴露几率大大增加，建议优先考虑撤离。
- **主动撤离**：轮次未用尽时玩家也可随时撤离，成功离开后视为结束。但需要注意，很多信息或物品只有在该次隐秘阶段可获取，扮演者一般不会有再来一次的机会。
- **撤离失败/被发现**：进入高难度战斗轮，或导致被识破、与某人交恶等后果。

# 其他篇

## 伤势相关

本游戏使用**魄**属性作为生命值（HP），魄的最大值由角色的体魄属性决定（通常为 10）。伤害直接扣除魄值，当魄值归零时角色失去行动能力。

### 轻伤

只要玩家单回合受到伤害小于最大魄值的 50%，就不算是受到了重伤。

- 行动影响：无。
- 生命归零：依旧是轻伤，需要通过**魄检定**才能维持意识，但哪怕昏迷也不影响生命安全；此时如果再次受到伤害会变为濒死状态。
- 自然恢复：需要进行魄检定。成功后魄值恢复 1 点。
- 医疗恢复：使用急救技能可恢复 1 点魄，每个伤势限处理一次。

### 重伤

只要玩家单回合受到伤害不低于最大魄值的 50%，就算是受到了重伤。

- 行动影响：受伤后需立即进行**魄检定**，失败则失去意识。
- 生命归零：视为濒死，立即昏迷。每轮需进行**魄检定**，直到通过治疗技能稳定伤势为止，期间魄检定失败则死亡。
- 自然恢复：无法进行自然恢复。
- 医疗恢复：当生命值恢复到最大魄值的 50% 时，视为脱离重伤；或者一个3成功的治疗也可以实现相同效果。

## 扩展相关

本节主要补充一些风格设定，便于玩家在扩展新的剧本、技能或道具时保持模组风格的统一。

### 等价

模组的核心规则是**等价交换**：一个强大的能力意味着更多的疯狂接触，也意味着更大的风险。没有无副作用的强大能力。玩家应将更多精力放在强大的精神和应对多变的技巧上。

### 定价

游戏内商店的道具定价为：

| 品质 | 积分 |
|:--:|:--:|
| 普通白 | 100 |
| 优良绿 | 300 |
| 稀有蓝 | 600 |
| 史诗紫 | 1000 |

副本难度与奖励同样采用白、绿、蓝、紫四个档位进行划分。

### 伤害

不考虑额外特质的话，本游戏血量最多为 10 点（魄属性）。COC 的血量上限是 20 点，所以如果想迁移 COC 的武器过来，只需要伤害除以 2 即可。

对于其他规则或者自己构想武器、技能时也可以参考这个血量上限来设计伤害。一般而言，不推荐伤害浮动值超过 D6（毕竟游戏主要用的是 6 面骰）。`;

    document.addEventListener('DOMContentLoaded', function() {
      const mdContent = document.getElementById('md-content');
      // 还原模板字符串中被转义的反引号，恢复 markdown 语法
      const mdTextUnescaped = mdText.replace(/\\`/g, '`');
      mdContent.innerHTML = marked.parse(mdTextUnescaped);

      // 悬挂缩进处理函数
      const applyHangingIndent = () => {
        // 处理表格td
        const tds = document.querySelectorAll('#md-content table td:nth-child(2)');
        tds.forEach(td => {
          const text = td.textContent.trim();
          if (text.startsWith('：')) {
            const firstColon = text.indexOf('：');
            const secondColon = text.indexOf('：', firstColon + 1);
            if (secondColon !== -1) {
              const term = text.slice(1, secondColon);
              const desc = text.slice(secondColon + 1);
              const termSpan = document.createElement('span');
              termSpan.textContent = term + '：';
              termSpan.className = 'term';
              const descSpan = document.createElement('span');
              descSpan.textContent = desc;
              descSpan.className = 'desc';
              td.innerHTML = '';
              td.appendChild(termSpan);
              td.appendChild(descSpan);
              // 计算term宽度并设置desc的margin-left
              const termWidth = termSpan.getBoundingClientRect().width;
              descSpan.style.marginLeft = termWidth + 'px';
              descSpan.style.display = 'block';
            }
          }
        });

        // 处理普通p
        const ps = document.querySelectorAll('#md-content p');
        ps.forEach(p => {
          const text = p.textContent.trim();
          if (text.startsWith('：')) {
            const firstColon = text.indexOf('：');
            const secondColon = text.indexOf('：', firstColon + 1);
            if (secondColon !== -1) {
              const term = text.slice(1, secondColon);
              const desc = text.slice(secondColon + 1);
              const tableDiv = document.createElement('div');
              tableDiv.className = 'hanging-table';
              const termDiv = document.createElement('div');
              termDiv.className = 'term-cell';
              termDiv.textContent = term + '：';
              const descDiv = document.createElement('div');
              descDiv.className = 'desc-cell';
              descDiv.textContent = desc;
              tableDiv.appendChild(termDiv);
              tableDiv.appendChild(descDiv);
              p.innerHTML = '';
              p.appendChild(tableDiv);
            }
          }
        });
      };

      // 生成目录
      const generateTOC = () => {
        const toc = document.getElementById('toc-list');
        toc.innerHTML = '';
        const headings = document.querySelectorAll('#md-content h1, #md-content h2, #md-content h3');
        headings.forEach(h => h.id = h.textContent.trim().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fff-]/g, ''));
        const items = Array.from(headings).map(h => ({ level: parseInt(h.tagName.slice(1)), text: h.textContent.trim(), id: h.id }));
        const ul = document.createElement('ul');
        const stack = [];
        items.forEach(item => {
          const li = document.createElement('li');
          li.className = 'level-' + item.level;
          li.innerHTML = `<a href="#${item.id}"><span class="first-char">${item.text[0]}</span>${item.text.slice(1)}</a><ul></ul>`;
          while (stack.length && stack[stack.length - 1].level >= item.level) stack.pop();
          (stack.length ? stack[stack.length - 1].li.querySelector('ul') : ul).appendChild(li);
          stack.push({ level: item.level, li });
        });
        toc.appendChild(ul);

        const setLines = async (ul) => {
          const t = document.getElementById('toc-list'), c = t.getBoundingClientRect();
          for (const li of ul.children) {
            const f = li.querySelector('.first-char');
            if (f) {
              const s = li.querySelector('ul');
              if (s && s.children.length) {
                const l = s.lastElementChild, lastA = l.querySelector('a');
                if (lastA) {
                  const fr = f.getBoundingClientRect(), lr = lastA.getBoundingClientRect();
                  const v = document.createElement('div');
                  v.style.cssText = `position:absolute;left:${fr.left - c.left + fr.width / 2}px;top:${fr.bottom - c.top}px;width:0;height:${lr.top + lr.height * 0.4 - fr.bottom}px;border-left:1px solid #999;`;
                  t.appendChild(v);
                  [...s.children].forEach(sl => {
                    const a = sl.querySelector('a');
                    if (a) {
                      const sr = a.getBoundingClientRect();
                      const h = document.createElement('div');
                      h.style.cssText = `position:absolute;left:${fr.left - c.left + fr.width / 2}px;top:${sr.top - c.top + sr.height * 0.4}px;width:12px;height:0;border-top:1px solid #999;`;
                      t.appendChild(h);
                    }
                  });
                }
              }
            }
            if (li.querySelector('ul')) {
              setTimeout(() => setLines(li.querySelector('ul')), 0);
            }
          }
        };
        setTimeout(async () => await setLines(ul), 0);
      };

      applyHangingIndent();
      generateTOC();
    });
  </script>
